[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "polyarb"
version = "0.1.0"
description = "Cross-venue arbitrage scanner and research logger for Polymarket and Kalshi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
    "requests>=2.32",
    "rapidfuzz>=3.10",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "python-dotenv>=1.0",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
polyarb = "polyarb.cli:main"

[tool.setuptools.packages.find]
include = ["polyarb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
